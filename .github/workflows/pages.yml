name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        # The demo is the site root. In the repository it imports ../index.js,
        # so the copy at the root is rewritten to ./index.js. /demo/ only
        # redirects, for links to the old address.
        run: |
          mkdir -p _site/demo
          cp index.js responsive-embed.js _site/
          sed 's#src="\.\./index\.js"#src="./index.js"#' demo/index.html > _site/index.html
          grep -q 'src="./index.js"' _site/index.html
          cat > _site/demo/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>responsive-embed</title>
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="../">
          <a href="../">responsive-embed demo</a>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
