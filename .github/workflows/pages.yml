name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        # The demo imports ../index.js, so the site mirrors the repository
        # layout. The root page only redirects to the demo.
        run: |
          mkdir -p _site/demo
          cp index.js responsive-embed.js _site/
          cp demo/index.html _site/demo/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>responsive-embed</title>
          <meta http-equiv="refresh" content="0; url=demo/">
          <link rel="canonical" href="demo/">
          <a href="demo/">responsive-embed demo</a>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
